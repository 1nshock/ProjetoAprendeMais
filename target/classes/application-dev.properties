# Configuracoes especificas do profile dev
server.port=8080

spring.datasource.url=${DEV_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/aprendemaisdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DEV_DATASOURCE_USERNAME:root}
spring.datasource.password=${DEV_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
